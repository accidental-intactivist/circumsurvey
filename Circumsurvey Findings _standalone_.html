document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

bg-soft:   #111714;\n  --fg:        #c8f0c0;\n  --fg-dim:    #6e9a68;\n  --rule:      #2a3a28;\n  --ink:       #7fe07f;   /* phosphor green */\n  --hot:       #ff3b8a;   /* magenta gap */\n  --warm:      #ffb000;   /* amber */\n  --cool:      #5dd2ff;   /* cyan */\n  --violet:    #b889ff;\n  --paper:     #0a0e0a;\n  --shadow:    0 0 14px rgba(127, 224, 127, 0.18);\n  --scanline-opacity: 0.18;\n  --noise-opacity: 0.06;\n}\n[data-theme=\"amber\"] {\n  --bg:        #14100a;\n  --bg-soft:   #1a160e;\n  --fg:        #f0d8a0;\n  --fg-dim:    #a07c44;\n  --rule:      #3a2e16;\n  --ink:       #ffb84d;\n  --hot:       #ff5e3a;\n  --warm:      #ffd86b;\n  --cool:      #ffa040;\n  --violet:    #ff8a3a;\n  --shadow:    0 0 14px rgba(255, 184, 77, 0.20);\n}\n[data-theme=\"pbs\"] {\n  --bg:        #f3e9d2;\n  --bg-soft:   #ece1c4;\n  --fg:        #1a1410;\n  --fg-dim:    #4a3a26;\n  --rule:      #c8b893;\n  --ink:       #c43a2e;        /* PBS red */\n  --hot:       #1652a8;        /* PBS blue */\n  --warm:      #ee9938;        /* PBS orange */\n  --cool:      #2b8c5a;        /* PBS green */\n  --violet:    #6a3aa8;\n  --shadow:    none;\n  --scanline-opacity: 0.05;\n}\n[data-theme=\"paper\"] {\n  --bg:        #f6f4ee;\n  --bg-soft:   #ebe7dc;\n  --fg:        #14110d;\n  --fg-dim:    #65604f;\n  --rule:      #d4ccb8;\n  --ink:       #14110d;\n  --hot:       #c43a2e;\n  --warm:      #c08a2e;\n  --cool:      #2a5e8a;\n  --violet:    #5a3a8c;\n  --shadow:    none;\n  --scanline-opacity: 0;\n}\n[data-theme=\"mono\"] {\n  --bg:        #000000;\n  --bg-soft:   #0a0a0a;\n  --fg:        #f4f4f4;\n  --fg-dim:    #8a8a8a;\n  --rule:      #2a2a2a;\n  --ink:       #ffffff;\n  --hot:       #ffffff;\n  --warm:      #ffffff;\n  --cool:      #ffffff;\n  --violet:    #ffffff;\n  --shadow:    none;\n  --scanline-opacity: 0.10;\n}\n\n/* ---------- GLOBAL ----------------------------------------------------- */\n* { box-sizing: border-box; margin: 0; padding: 0; }\nhtml { scroll-behavior: smooth; }\nbody {\n  background: var(--bg);\n  color: var(--fg);\n  font-family: 'Space Grotesk', system-ui, sans-serif;\n  font-size: 18px;\n  line-height: 1.55;\n  -webkit-font-smoothing: antialiased;\n  overflow-x: hidden;\n  text-rendering: optimizeLegibility;\n}\n\n/* CRT scanlines + faint noise overlay */\nbody::before {\n  content: \"\";\n  position: fixed;\n  inset: 0;\n  pointer-events: none;\n  z-index: 9000;\n  background-image: repeating-linear-gradient(\n    to bottom,\n    rgba(0,0,0, var(--scanline-opacity)) 0px,\n    rgba(0,0,0, var(--scanline-opacity)) 1px,\n    transparent 1px,\n    transparent 3px\n  );\n  mix-blend-mode: multiply;\n}\nbody::after {\n  content: \"\";\n  position: fixed;\n  inset: 0;\n  pointer-events: none;\n  z-index: 9001;\n  background-image: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.45) 100%);\n}\n[data-theme=\"paper\"] body::before,\n[data-theme=\"paper\"] body::after,\n[data-theme=\"pbs\"] body::after { display: none; }\n\n/* ---------- TYPE ------------------------------------------------------- */\n.mono { font-family: 'VT323', 'DM Mono', monospace; letter-spacing: 0.02em; }\n.dmm  { font-family: 'DM Mono', monospace; }\n.serif{ font-family: 'Instrument Serif', Georgia, serif; }\n.disp { font-family: 'Space Grotesk', sans-serif; font-weight: 500; letter-spacing: -0.02em; }\n\nh1, h2, h3 { font-family: 'Space Grotesk', sans-serif; font-weight: 500; letter-spacing: -0.025em; line-height: 1.02; text-wrap: balance; }\n\n.tag {\n  font-family: 'VT323', monospace;\n  font-size: 18px;\n  letter-spacing: 0.18em;\n  text-transform: uppercase;\n  color: var(--ink);\n  display: inline-flex;\n  align-items: center;\n  gap: 10px;\n}\n.tag::before {\n  content: \"\"; width: 10px; height: 10px;\n  background: var(--ink); display: inline-block;\n}\n.tag.warm { color: var(--warm); }\n.tag.warm::before { background: var(--warm); }\n.tag.hot { color: var(--hot); }\n.tag.hot::before { background: var(--hot); }\n.tag.cool { color: var(--cool); }\n.tag.cool::before { background: var(--cool); }\n\n.kicker {\n  font-family: 'VT323', monospace;\n  font-size: 22px;\n  letter-spacing: 0.10em;\n  text-transform: uppercase;\n  color: var(--fg-dim);\n}\n\n/* ---------- LAYOUT ----------------------------------------------------- */\n.act {\n  position: relative;\n  min-height: 100vh;\n  padding: 8rem 6vw;\n  display: flex;\n  flex-direction: column;\n  justify-content: center;\n}\n.act.tall { min-height: 200vh; }\n.act.taller { min-height: 300vh; }\n.act.short { min-height: 60vh; padding: 5rem 6vw; }\n\n.act-grid {\n  display: grid;\n  grid-template-columns: minmax(0,1fr);\n  gap: 3rem;\n  max-width: 1400px;\n  margin: 0 auto;\n  width: 100%;\n}\n.center {\n  max-width: 980px;\n  margin: 0 auto;\n  width: 100%;\n}\n.narrow {\n  max-width: 720px;\n  margin: 0 auto;\n  width: 100%;\n}\n\n.h-rule {\n  height: 1px;\n  background: var(--rule);\n  width: 100%;\n}\n.h-rule.dashed {\n  background: none;\n  border-top: 1px dashed var(--rule);\n  height: 0;\n}\n.dotted-rule {\n  background: radial-gradient(circle, var(--ink) 1px, transparent 1.5px) 0 0 / 8px 1px repeat-x;\n  height: 1px;\n  width: 100%;\n}\n\n/* ---------- FRAME / CHROME --------------------------------------------- */\n.crt-frame {\n  border: 1px solid var(--rule);\n  padding: 1.5rem 1.75rem;\n  background: var(--bg-soft);\n  position: relative;\n}\n.crt-frame .corner {\n  position: absolute;\n  width: 14px; height: 14px;\n  border-color: var(--ink);\n}\n.crt-frame .corner.tl { top: -1px; left: -1px;  border-top: 1px solid; border-left: 1px solid; }\n.crt-frame .corner.tr { top: -1px; right: -1px; border-top: 1px solid; border-right: 1px solid; }\n.crt-frame .corner.bl { bottom: -1px; left: -1px; border-bottom: 1px solid; border-left: 1px solid; }\n.crt-frame .corner.br { bottom: -1px; right: -1px; border-bottom: 1px solid; border-right: 1px solid; }\n\n/* ---------- TYPOGRAPHIC PRIMITIVES ------------------------------------- */\n.title-xxl {\n  font-size: clamp(48px, 9.5vw, 156px);\n  line-height: 0.92;\n  letter-spacing: -0.035em;\n  font-weight: 500;\n}\n.title-xl {\n  font-size: clamp(40px, 6.5vw, 96px);\n  line-height: 0.98;\n  letter-spacing: -0.03em;\n}\n.title-l {\n  font-size: clamp(32px, 4.4vw, 64px);\n  line-height: 1.05;\n  letter-spacing: -0.025em;\n}\n.title-m {\n  font-size: clamp(22px, 2.6vw, 36px);\n  line-height: 1.15;\n  letter-spacing: -0.01em;\n  font-weight: 500;\n}\n.body {\n  font-size: clamp(16px, 1.15vw, 19px);\n  line-height: 1.65;\n  color: var(--fg);\n  max-width: 60ch;\n}\n.body.dim { color: var(--fg-dim); }\n\n.pull-serif {\n  font-family: 'Instrument Serif', Georgia, serif;\n  font-style: italic;\n  font-size: clamp(28px, 3.2vw, 44px);\n  line-height: 1.2;\n  color: var(--fg);\n  font-weight: 400;\n  letter-spacing: 0.005em;\n  text-wrap: balance;\n}\n\n/* ---------- HEADER / NAV ----------------------------------------------- */\n.topbar {\n  position: fixed;\n  top: 0; left: 0; right: 0;\n  height: 44px;\n  background: var(--bg);\n  border-bottom: 1px solid var(--rule);\n  z-index: 5000;\n  display: flex;\n  align-items: center;\n  padding: 0 1.5rem;\n  font-family: 'VT323', monospace;\n  font-size: 18px;\n  letter-spacing: 0.08em;\n  text-transform: uppercase;\n  color: var(--fg-dim);\n}\n.topbar .brand { color: var(--ink); margin-right: auto; display: flex; align-items: baseline; }\n.topbar .meta-tag { font-size: 16px; letter-spacing: 0.10em; }\n@media (max-width: 1100px) {\n  .topbar .meta-tag { display: none; }\n}\n.topbar .brand .blink { animation: blink 1.1s steps(2) infinite; }\n@keyframes blink { 50% { opacity: 0; } }\n.topbar .progress {\n  flex: 1; max-width: 280px;\n  height: 7px;\n  margin: 0 1.5rem;\n  border: 1px solid var(--rule);\n  position: relative;\n  overflow: hidden;\n  background: var(--bg);\n}\n.topbar .progress::after {\n  content: \"\";\n  position: absolute;\n  inset: 0;\n  width: var(--progress, 0%);\n  background: var(--ink);\n}\n.topbar .theme-pills {\n  display: flex;\n  gap: 6px;\n  align-items: center;\n}\n.topbar .theme-pills button {\n  background: transparent;\n  border: 1px solid var(--rule);\n  font-family: inherit;\n  font-size: 14px;\n  color: var(--fg-dim);\n  padding: 4px 8px;\n  cursor: pointer;\n  letter-spacing: 0.10em;\n}\n.topbar .theme-pills button[aria-pressed=\"true\"] {\n  border-color: var(--ink);\n  color: var(--ink);\n}\n.topbar .theme-pills button:hover { color: var(--fg); }\n\nmain { padding-top: 44px; }\n\n/* ---------- COLD OPEN -------------------------------------------------- */\n.cold-open {\n  min-height: 100vh;\n  padding: 6rem 6vw 4rem;\n  display: grid;\n  align-content: space-between;\n  position: relative;\n}\n.boot {\n  font-family: 'VT323', monospace;\n  font-size: 22px;\n  line-height: 1.4;\n  color: var(--ink);\n  text-shadow: var(--shadow);\n}\n.boot .line { white-space: pre; opacity: 0; }\n.boot .line.shown { opacity: 1; }\n.cursor-blk {\n  display: inline-block;\n  width: 0.5em;\n  height: 0.85em;\n  background: var(--ink);\n  animation: blink 1.1s steps(2) infinite;\n  vertical-align: -0.05em;\n  margin-left: 2px;\n}\n.title-block .title-xxl {\n  text-shadow: 0 0 24px rgba(127, 224, 127, 0.15);\n}\n\n/* ---------- DOTPLOT --------------------------------------------------- */\n.dotplot {\n  display: grid;\n  grid-template-columns: repeat(40, 1fr);\n  gap: 4px;\n  width: 100%;\n}\n.dotplot .dot {\n  aspect-ratio: 1;\n  background: var(--fg-dim);\n  border-radius: 50%;\n  opacity: 0.45;\n  transition: opacity .35s, background .35s, transform .35s;\n}\n.dotplot .dot.on { opacity: 1; background: var(--ink); }\n.dotplot .dot.intact { background: var(--cool); opacity: 1; }\n.dotplot .dot.circ   { background: var(--hot); opacity: 1; }\n.dotplot .dot.restor { background: var(--warm); opacity: 1; }\n\n/* ---------- PINNED CHART ---------------------------------------------- */\n.sticky-wrap {\n  position: relative;\n}\n.sticky-wrap .sticky {\n  position: sticky;\n  top: 44px;\n  height: calc(100vh - 44px);\n  display: grid;\n  align-content: center;\n  padding: 1.5rem 5vw;\n  overflow: hidden;\n}\n.sticky-head { display: grid; gap: 0.4rem; }\n.sticky-head h2 {\n  font-size: clamp(22px, 2.6vw, 38px);\n  line-height: 1.08;\n  margin: 0;\n  text-wrap: balance;\n}\n.sticky-head .lead {\n  font-size: clamp(13px, 1.1vw, 16px);\n  color: var(--fg-dim);\n  max-width: 78ch;\n  line-height: 1.5;\n  margin: 0;\n}\n.gap-chart {\n  width: min(1100px, 100%);\n  display: grid;\n  gap: clamp(0.15rem, 0.7vh, 0.5rem);\n  margin: clamp(0.5rem, 2vh, 1.5rem) auto 0;\n}\n.gap-row {\n  display: grid;\n  grid-template-columns: clamp(180px, 22vw, 280px) 1fr;\n  gap: 1.25rem;\n  align-items: center;\n  padding: clamp(0.1rem, 0.5vh, 0.4rem) 0;\n  border-top: 1px dashed var(--rule);\n}\n.gap-row .lbl {\n  font-family: 'VT323', monospace;\n  font-size: clamp(15px, 1.4vw, 22px);\n  letter-spacing: 0.04em;\n  color: var(--fg);\n  text-transform: uppercase;\n  line-height: 1.05;\n}\n.gap-row .lbl small {\n  display: block;\n  color: var(--fg-dim);\n  font-size: clamp(10px, 0.85vw, 13px);\n  letter-spacing: 0.10em;\n  margin-top: 2px;\n}\n.gap-bars {\n  position: relative;\n  height: clamp(40px, 8vh, 64px);\n}\n.gap-bar {\n  position: absolute;\n  left: 0;\n  height: clamp(9px, 1.6vh, 16px);\n  background: var(--ink);\n  transition: width 1.2s cubic-bezier(0.22, 1, 0.36, 1), opacity .4s;\n  opacity: 0;\n  width: 0;\n}\n.gap-bar.intact { top: 0;                              background: var(--cool); }\n.gap-bar.restor { top: calc(clamp(9px, 1.6vh, 16px) + clamp(2px, 0.6vh, 6px));  background: var(--warm); }\n.gap-bar.circ   { top: calc((clamp(9px, 1.6vh, 16px) + clamp(2px, 0.6vh, 6px)) * 2); background: var(--hot); }\n\n.gap-chart {\n  width: min(1100px, 100%);\n  display: grid;\n  gap: clamp(0.15rem, 0.7vh, 0.5rem);\n  margin: clamp(0.5rem, 2vh, 1.5rem) auto 0;\n}\n.gap-row-old { /* removed; see new rules above */ }\n.gap-row.show .gap-bar { opacity: 1; }\n.gap-bar .val {\n  position: absolute;\n  right: -52px;\n  top: -2px;\n  font-family: 'VT323', monospace;\n  font-size: 18px;\n  color: inherit;\n  color: var(--fg);\n}\n\n/* ---------- BIG NUMBER ------------------------------------------------ */\n.big-num {\n  font-family: 'Space Grotesk', sans-serif;\n  font-weight: 500;\n  font-size: clamp(96px, 18vw, 280px);\n  line-height: 0.85;\n  letter-spacing: -0.05em;\n  color: var(--ink);\n  text-shadow: var(--shadow);\n  font-variant-numeric: tabular-nums;\n}\n.big-num.hot { color: var(--hot); text-shadow: 0 0 14px rgba(255, 59, 138, 0.20); }\n.big-num.warm { color: var(--warm); text-shadow: 0 0 14px rgba(255, 176, 0, 0.22); }\n.big-num.cool { color: var(--cool); }\n.big-num sup { font-size: 0.35em; vertical-align: super; margin-left: 0.1em; opacity: 0.7; }\n\n/* ---------- BARS (perceptions) ---------------------------------------- */\n.perception-row {\n  display: grid;\n  grid-template-columns: 1fr;\n  gap: 0.4rem;\n  padding: 1rem 0;\n  border-top: 1px dashed var(--rule);\n}\n.perception-row .attr {\n  font-family: 'VT323', monospace;\n  font-size: 22px;\n  letter-spacing: 0.03em;\n  color: var(--fg);\n  text-transform: uppercase;\n}\n.perc-bar {\n  position: relative;\n  display: flex;\n  height: 20px;\n  background: var(--bg-soft);\n  border: 1px solid var(--rule);\n  overflow: hidden;\n}\n.perc-seg { height: 100%; transition: width 1.4s cubic-bezier(0.22, 1, 0.36, 1); }\n.perc-seg.intact { background: var(--cool); }\n.perc-seg.equal  { background: var(--fg-dim); }\n.perc-seg.unsure { background: transparent; }\n.perc-seg.circ   { background: var(--hot); }\n.perc-legend {\n  display: flex;\n  gap: 1.5rem;\n  font-family: 'VT323', monospace;\n  font-size: 16px;\n  color: var(--fg-dim);\n  letter-spacing: 0.08em;\n  text-transform: uppercase;\n  padding-top: 4px;\n}\n.perc-legend .sw { display:inline-block; width: 12px; height: 12px; margin-right: 6px; vertical-align: -1px; }\n.perc-legend .sw.intact { background: var(--cool); }\n.perc-legend .sw.equal  { background: var(--fg-dim); }\n.perc-legend .sw.circ   { background: var(--hot); }\n\n/* ---------- QUOTE CARDS ----------------------------------------------- */\n.quote-card {\n  border: 1px solid var(--rule);\n  padding: 1.4rem 1.6rem;\n  background: var(--bg-soft);\n  position: relative;\n  max-width: 540px;\n}\n.quote-card .q {\n  font-family: 'Instrument Serif', Georgia, serif;\n  font-style: italic;\n  font-size: 24px;\n  line-height: 1.32;\n  color: var(--fg);\n}\n.quote-card .src {\n  margin-top: 0.7rem;\n  font-family: 'VT323', monospace;\n  font-size: 16px;\n  letter-spacing: 0.12em;\n  color: var(--ink);\n  text-transform: uppercase;\n}\n.quote-card::before {\n  content: \"“\";\n  font-family: 'Instrument Serif', serif;\n  font-size: 64px;\n  position: absolute;\n  top: -22px; left: 10px;\n  line-height: 1;\n  color: var(--ink);\n  background: var(--bg);\n  padding: 0 8px;\n}\n\n/* ---------- ASCII / OP-ART CONTAINER ---------------------------------- */\n.opart { position: relative; }\n.opart svg { display: block; }\n.opart .stroke { stroke: var(--ink); fill: none; }\n.opart .stroke.hot { stroke: var(--hot); }\n.opart .stroke.warm { stroke: var(--warm); }\n.opart .stroke.cool { stroke: var(--cool); }\n.opart .stroke.dim { stroke: var(--rule); }\n\n/* ---------- REVEAL ANIMATIONS ----------------------------------------- */\n.reveal {\n  opacity: 0;\n  transform: translateY(24px);\n  transition: opacity .9s cubic-bezier(0.22,1,0.36,1), transform .9s cubic-bezier(0.22,1,0.36,1);\n}\n.reveal.in { opacity: 1; transform: translateY(0); }\n.reveal.d1 { transition-delay: 0.10s; }\n.reveal.d2 { transition-delay: 0.22s; }\n.reveal.d3 { transition-delay: 0.36s; }\n.reveal.d4 { transition-delay: 0.52s; }\n.reveal.d5 { transition-delay: 0.70s; }\n\n/* ---------- UTIL ------------------------------------------------------ */\n.row { display: flex; gap: 1.5rem; flex-wrap: wrap; }\n.col { display: flex; flex-direction: column; gap: 1.5rem; }\n.between { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; flex-wrap: wrap; }\n.gap-s { gap: 0.5rem; }\n.gap-m { gap: 1rem; }\n.gap-l { gap: 2rem; }\n.gap-xl { gap: 3rem; }\n.mt-l { margin-top: 2rem; }\n.mt-xl { margin-top: 4rem; }\n.mb-l { margin-bottom: 2rem; }\n.txt-center { text-align: center; }\n.txt-right { text-align: right; }\n.hot { color: var(--hot); }\n.warm { color: var(--warm); }\n.cool { color: var(--cool); }\n.ink { color: var(--ink); }\n.dim { color: var(--fg-dim); }\n.uppercase { text-transform: uppercase; letter-spacing: 0.08em; }\n\n/* ---------- TWO COL --------------------------------------------------- */\n.two-col {\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  gap: 4rem;\n  align-items: start;\n}\n@media (max-width: 900px) {\n  .two-col { grid-template-columns: 1fr; gap: 2.5rem; }\n  .gap-row { grid-template-columns: 1fr; gap: 0.5rem; }\n  .topbar .progress { display: none; }\n  .act { padding: 5rem 6vw; }\n  .dotplot { grid-template-columns: repeat(25, 1fr); }\n}\n\n/* ---------- CTA ------------------------------------------------------- */\n.cta-btn {\n  display: inline-flex;\n  align-items: center;\n  gap: 1rem;\n  padding: 1.1rem 1.8rem;\n  border: 1px solid var(--ink);\n  background: transparent;\n  color: var(--ink);\n  font-family: 'VT323', monospace;\n  font-size: 24px;\n  letter-spacing: 0.12em;\n  text-transform: uppercase;\n  text-decoration: none;\n  position: relative;\n  transition: background .2s, color .2s;\n  text-shadow: var(--shadow);\n}\n.cta-btn:hover { background: var(--ink); color: var(--bg); text-shadow: none; }\n.cta-btn::after { content: \"▸\"; font-size: 18px; }\n\n/* ---------- FOOTER ---------------------------------------------------- */\nfooter.foot {\n  border-top: 1px solid var(--rule);\n  padding: 4rem 6vw 6rem;\n  background: var(--bg-soft);\n  font-family: 'VT323', monospace;\n  font-size: 18px;\n  color: var(--fg-dim);\n  letter-spacing: 0.04em;\n}\nfooter.foot a { color: var(--ink); text-decoration: none; }\nfooter.foot a:hover { text-decoration: underline; }\nfooter.foot .cols {\n  display: grid;\n  grid-template-columns: 2fr 1fr 1fr;\n  gap: 3rem;\n  max-width: 1400px;\n  margin: 0 auto;\n}\n@media (max-width: 800px) { footer.foot .cols { grid-template-columns: 1fr; } }\n\n/* ---------- MISC ------------------------------------------------------ */\n::selection { background: var(--ink); color: var(--bg); }\n\n\n/* ============================================================\n   HARMONIC CANVAS — full-viewport ambient ribbon field\n   ============================================================ */\n.harmonic-canvas {\n  position: fixed;\n  inset: 0;\n  width: 100vw;\n  height: 100vh;\n  pointer-events: none;\n  z-index: 0;\n  opacity: 0;\n  transition: opacity 0.6s ease;\n  mix-blend-mode: screen;\n}\n/* paper/pbs themes: screen blend washes out — use multiply instead */\n[data-theme=\"paper\"] .harmonic-canvas,\n[data-theme=\"pbs\"]   .harmonic-canvas {\n  mix-blend-mode: multiply;\n}\n\n/* Editorial sections need to sit above the harmonic canvas — bump them\n   above z:0 and keep their background opaque enough for legibility. */\n.act { position: relative; z-index: 1; }\n.topbar { z-index: 1000; }\n\n/* When the harmonic system is on, certain hero acts get a darker vignette\n   wash so text stays readable against the active ribbon weather. */\n.act[data-harmonic-hero] {\n  background:\n    radial-gradient(ellipse at center, transparent 0%, color-mix(in srgb, var(--bg) 55%, transparent) 60%, var(--bg) 100%);\n}\n[data-theme=\"paper\"] .act[data-harmonic-hero],\n[data-theme=\"pbs\"]   .act[data-harmonic-hero] {\n  background:\n    radial-gradient(ellipse at center, transparent 0%, color-mix(in srgb, var(--bg) 70%, transparent) 65%, var(--bg) 100%);\n}\n\n/* ============================================================\n   RESPONDENT MAP — hero dot-maps of where respondents came from\n   ============================================================ */\n.reach-map {\n  position: relative;\n  width: 100%;\n  border: 1px solid var(--rule);\n  background:\n    linear-gradient(180deg, var(--bg) 0%, var(--bg-soft) 100%);\n  padding: 1rem 1.25rem 1.5rem;\n  box-shadow: var(--shadow);\n}\n.reach-map::before,\n.reach-map::after {\n  content: \"\";\n  position: absolute;\n  width: 14px; height: 14px;\n  border-color: var(--ink);\n  opacity: 0.55;\n}\n.reach-map::before {\n  top: -1px; left: -1px;\n  border-top: 1px solid; border-left: 1px solid;\n}\n.reach-map::after {\n  bottom: -1px; right: -1px;\n  border-bottom: 1px solid; border-right: 1px solid;\n}\n.reach-map .rm-svg {\n  width: 100%;\n  height: auto;\n  display: block;\n}\n\n/* Continent silhouettes — faint dashed polygons under the dots */\n.rm-continent {\n  fill: var(--bg-soft);\n  stroke: var(--rule);\n  stroke-width: 1;\n  stroke-dasharray: 3 3;\n  opacity: 0.85;\n}\n[data-theme=\"paper\"] .rm-continent,\n[data-theme=\"pbs\"]   .rm-continent {\n  fill: color-mix(in srgb, var(--ink) 6%, transparent);\n  stroke: color-mix(in srgb, var(--ink) 35%, transparent);\n}\n.rm-continent.thick {\n  stroke-dasharray: none;\n  stroke-width: 1.2;\n  opacity: 1;\n}\n\n/* Lat / lon grid */\n.rm-grid line {\n  stroke: var(--rule);\n  stroke-width: 0.5;\n  opacity: 0.35;\n}\n\n/* Corner ticks (drafting frame) */\n.rm-corners line {\n  stroke: var(--ink);\n  stroke-width: 1.5;\n  opacity: 0.7;\n}\n\n/* Respondent dots */\n.rm-dot {\n  fill: var(--ink);\n  opacity: 0.85;\n}\n.rm-dot.warm { fill: var(--warm); }\n.rm-dot.hot  { fill: var(--hot); }\n.rm-dot.cool { fill: var(--cool); }\n[data-theme=\"paper\"] .rm-dot,\n[data-theme=\"pbs\"]   .rm-dot {\n  opacity: 0.9;\n}\n\n/* Pin labels */\n.rm-pin-line {\n  stroke: var(--ink);\n  stroke-width: 1;\n  opacity: 0.65;\n}\n.rm-pin-dot {\n  fill: none;\n  stroke: var(--ink);\n  stroke-width: 1.4;\n}\n\n/* Map text labels */\n.rm-label {\n  font-family: 'VT323', monospace;\n  font-size: 20px;\n  letter-spacing: 0.12em;\n  fill: var(--ink);\n  text-transform: uppercase;\n}\n.rm-label.dim {\n  fill: var(--fg-dim);\n  font-size: 16px;\n  letter-spacing: 0.10em;\n}\n.rm-label.axis {\n  font-size: 14px;\n  letter-spacing: 0.16em;\n  fill: var(--fg-dim);\n}\n.rm-label.huge {\n  font-size: 36px;\n  letter-spacing: 0.16em;\n}\n\n/* Stagger-fade respondent dots when the map enters the viewport */\n.reach-map .rm-cluster {\n  opacity: 0;\n  transition: opacity 1.2s cubic-bezier(0.22, 1, 0.36, 1);\n}\n.reveal.in .rm-cluster { opacity: 1; }\n\n/* Reach stat grid under the world map */\n.reach-stats {\n  display: grid;\n  grid-template-columns: repeat(4, 1fr);\n  gap: 1.5rem;\n  border-top: 1px dashed var(--rule);\n  border-bottom: 1px dashed var(--rule);\n  padding: 1.75rem 0;\n}\n.reach-stats .reach-stat {\n  text-align: left;\n}\n.reach-stats .reach-stat .big-num {\n  font-size: clamp(54px, 7vw, 90px);\n  line-height: 1;\n  margin-top: 0.35rem;\n}\n@media (max-width: 900px) {\n  .reach-stats { grid-template-columns: repeat(2, 1fr); }\n  .rm-label.huge { font-size: 24px; }\n  .rm-label { font-size: 14px; }\n  .rm-label.dim { font-size: 12px; }\n}\n<\u002Fstyle>\n\n<\u002Fhead>\n<body>\n\n<!-- ===================== TOP BAR ===================== -->\n<header class=\"topbar\">\n  <div class=\"brand\" style=\"display:flex; align-items:baseline; gap: 1ch; white-space: nowrap;\">\n    <span>● CIRCUMSURVEY<span class=\"blink\">_<\u002Fspan><\u002Fspan>\n    <span class=\"meta-tag\" style=\"color: var(--fg-dim);\">· PHASE 01 · N=452<\u002Fspan>\n  <\u002Fdiv>\n  <div class=\"progress\" aria-hidden=\"true\"><\u002Fdiv>\n  <div class=\"theme-pills\" role=\"group\" aria-label=\"Display theme\"><\u002Fdiv>\n<\u002Fheader>\n\n<main>\n\n<!-- ===================== ACT 01 · COLD OPEN ===================== -->\n<section class=\"act cold-open\" data-screen-label=\"01 Cold Open\" data-harmonic-hero=\"\">\n  <div>\n    <div class=\"boot\">\n      <div class=\"line\">CIRCUMSURVEY/OS v1.0   © THE ACCIDENTAL INTACTIVIST<\u002Fdiv>\n      <div class=\"line\">────────────────────────────────────────────<\u002Fdiv>\n      <div class=\"line\">MOUNTING DATASET . . . . . . . . . . . . . . OK<\u002Fdiv>\n      <div class=\"line\">RESPONDENTS . . . . . . . . . . . . . . . 452<\u002Fdiv>\n      <div class=\"line\">COUNTRIES . . . . . . . . . . . . . . . .  35<\u002Fdiv>\n      <div class=\"line\">CIRCUMCISION STATES . . . . . . . . . . .   3<\u002Fdiv>\n      <div class=\"line\">PATHWAYS . . . . . . . . . . . . . . . . .  6<\u002Fdiv>\n      <div class=\"line\">QUESTIONS . . . . . . . . . . . . . . . .368<\u002Fdiv>\n      <div class=\"line\">───────────────────────────────────────── RUN<\u002Fdiv>\n      <div class=\"line\">&gt; LOAD \"FINDINGS\"<span class=\"cursor-blk\"><\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"title-block reveal d3\">\n    <div class=\"kicker mb-l\">A SPECIAL REPORT · JUNE 2025<\u002Fdiv>\n    <h1 class=\"title-xxl\">The<br>Transparent<br>Monster.<\u002Fh1>\n    <p class=\"pull-serif mt-l\" style=\"max-width: 920px;\">\n      Findings from the first 452 respondents of <span class=\"ink\">The&nbsp;Accidental&nbsp;Intactivist's&nbsp;Inquiry<\u002Fspan> — a survey about a thing that is everywhere, and almost never discussed honestly.\n    <\u002Fp>\n  <\u002Fdiv>\n\n  <div class=\"reveal d5\" style=\"display:flex; align-items:center; gap: 2rem; flex-wrap: wrap; margin-top: 4rem;\">\n    <div data-art=\"spiro\" data-size=\"220\" data-r=\"100\" data-subr=\"33\" data-d=\"64\" data-loops=\"42\" data-color=\"stroke\" data-weight=\"0.5\"><\u002Fdiv>\n    <div>\n      <div class=\"kicker\">↓ scroll to begin<\u002Fdiv>\n      <div class=\"mono dim\" style=\"margin-top: 6px;\">EST. READING TIME · 16 MIN<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===================== ACT 02 · THE QUESTION ===================== -->\n<section class=\"act\" data-screen-label=\"02 The Question\">\n  <div class=\"center\">\n    <div class=\"reveal\">\n      <div class=\"mono ink\" style=\"font-size:20px; letter-spacing:0.18em;\">[ ACT 01 · A SIMPLE QUESTION ]<\u002Fdiv>\n    <\u002Fdiv>\n\n    <h2 class=\"title-xl reveal d1 mt-l\">\n      Why isn't this <span class=\"serif\" style=\"font-style:italic; color: var(--warm);\">weird<\u002Fspan> to&nbsp;more of&nbsp;us?\n    <\u002Fh2>\n\n    <div class=\"two-col mt-xl\">\n      <div class=\"reveal d2\">\n        <p class=\"body\">\n          A healthy newborn's body is, by default, intact. In the United States — and in a handful of other countries — a part of that body is routinely cut off within hours or days of birth. There is no disease to treat. There is no standardized procedure. There is no required training to perform it. There are no long-term outcome studies the way there are for any other surgery.\n        <\u002Fp>\n        <p class=\"body mt-l\">\n          The practice survives because it is invisible to the people inside it. It is presented as cosmetic, hygienic, traditional, modern, or simply <span class=\"ink\">\"what we do.\"<\u002Fspan>\n        <\u002Fp>\n        <p class=\"body mt-l\">\n          We launched the Circumsurvey to ask the people who actually live in these bodies — and the people who love them — what is actually happening.\n        <\u002Fp>\n      <\u002Fdiv>\n      <div class=\"reveal d3\">\n        <div data-art=\"wave\" data-size=\"500\" data-height=\"380\" data-n=\"34\" data-amp=\"22\" data-freq=\"0.018\" data-phase=\"0.6\" data-color=\"stroke\" data-weight=\"0.55\"><\u002Fdiv>\n        <div class=\"mono dim mt-l\" style=\"font-size:16px;\">FIG. 01 — RESPONDENT VOICES, BY VOLUME<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===================== ACT 03 · THE INQUIRY ===================== -->\n<section class=\"act\" data-screen-label=\"03 The Inquiry\">\n  <div class=\"center\">\n    <div class=\"reveal mono ink\" style=\"font-size:20px; letter-spacing:0.18em;\">[ ACT 02 · THE INQUIRY ]<\u002Fdiv>\n    <h2 class=\"title-l reveal d1 mt-l\">An ordinary American started asking questions.<br>What he found was anything but ordinary.<\u002Fh2>\n\n    <div class=\"two-col mt-xl gap-xl\">\n      <div class=\"reveal d1\">\n        <p class=\"body\">\n          The <span class=\"ink\">Accidental Intactivist<\u002Fspan> didn't set out to lead a movement. He stumbled into an absence — a giant hole in the conversation his culture had taught him to walk past.\n        <\u002Fp>\n        <p class=\"body mt-l\">\n          The deeper he looked, the louder the silence became. Where were the men's testimonies? Where were the partners' observations? Where was the comparative data — the kind we'd demand for any other elective surgery performed on a newborn?\n        <\u002Fp>\n        <p class=\"body mt-l\">\n          So he built a survey. 368 questions. Six pathways. Open to anyone, anywhere. The first 500 responses arrived in three weeks. The signal in them is overwhelming.\n        <\u002Fp>\n      <\u002Fdiv>\n\n      <div class=\"reveal d2\">\n        <div class=\"crt-frame\">\n          <span class=\"corner tl\"><\u002Fspan><span class=\"corner tr\"><\u002Fspan><span class=\"corner bl\"><\u002Fspan><span class=\"corner br\"><\u002Fspan>\n          <div class=\"kicker mb-l\">SURVEY METHODOLOGY<\u002Fdiv>\n          <table class=\"mono\" style=\"width:100%; border-collapse:collapse;\">\n            <tbody><tr><td style=\"padding:8px 0; color:var(--fg-dim);\">PHASE<\u002Ftd><td style=\"text-align:right; color:var(--ink);\">01<\u002Ftd><\u002Ftr>\n            <tr><td style=\"padding:8px 0; color:var(--fg-dim);\">RESPONDENTS<\u002Ftd><td style=\"text-align:right; color:var(--ink);\">452<\u002Ftd><\u002Ftr>\n            <tr><td style=\"padding:8px 0; color:var(--fg-dim);\">COUNTRIES<\u002Ftd><td style=\"text-align:right; color:var(--ink);\">35<\u002Ftd><\u002Ftr>\n            <tr><td style=\"padding:8px 0; color:var(--fg-dim);\">QUESTIONS<\u002Ftd><td style=\"text-align:right; color:var(--ink);\">368<\u002Ftd><\u002Ftr>\n            <tr><td style=\"padding:8px 0; color:var(--fg-dim);\">PATHWAYS<\u002Ftd><td style=\"text-align:right; color:var(--ink);\">06<\u002Ftd><\u002Ftr>\n            <tr><td style=\"padding:8px 0; color:var(--fg-dim);\">FIELD WINDOW<\u002Ftd><td style=\"text-align:right; color:var(--ink);\">JUNE 2025<\u002Ftd><\u002Ftr>\n            <tr><td style=\"padding:8px 0; color:var(--fg-dim);\">STATUS<\u002Ftd><td style=\"text-align:right; color:var(--warm);\">OPEN · ONGOING<\u002Ftd><\u002Ftr>\n          <\u002Ftbody><\u002Ftable>\n        <\u002Fdiv>\n\n        <div class=\"quote-card mt-l\">\n          <div class=\"q\">Most people don't think at all. This abuse is normalized — and as such, you'd be hard pressed to find anyone willing to even consider it.<\u002Fdiv>\n          <div class=\"src\">— Restoring · Mid-30s<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===================== ACT 04 · REACH · THE WORLD ===================== -->\n<section class=\"act\" data-screen-label=\"04 Reach · World\" data-harmonic-hero=\"\">\n  <div class=\"center\">\n    <div class=\"reveal mono ink\" style=\"font-size:20px; letter-spacing:0.18em;\">[ ACT 03 · WHERE THEY ANSWERED FROM ]<\u002Fdiv>\n    <h2 class=\"title-l reveal d1 mt-l\">A&nbsp;368-question survey&nbsp;about a body part most people refuse to discuss.<br><span class=\"serif\" style=\"font-style:italic; color: var(--warm);\">35&nbsp;countries<\u002Fspan>&nbsp;answered.<\u002Fh2>\n    <p class=\"body mt-l reveal d2 dim\" style=\"max-width: 64ch;\">\n      Each dot is one respondent, placed near the country they answered from. The signal isn't concentrated in any one culture — it surfaces in every continent except Antarctica. But its center of gravity is not subtle.\n    <\u002Fp>\n\n    <div class=\"reach-stats reveal d3 mt-xl\">\n      <div class=\"reach-stat\">\n        <div class=\"kicker\">RESPONDENTS<\u002Fdiv>\n        <div class=\"big-num\" data-count=\"452\" data-dur=\"1400\">0<\u002Fdiv>\n        <div class=\"mono dim\">individuals<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"reach-stat\">\n        <div class=\"kicker\">COUNTRIES<\u002Fdiv>\n        <div class=\"big-num\" data-count=\"35\" data-dur=\"1100\">0<\u002Fdiv>\n        <div class=\"mono dim\">distinct nations<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"reach-stat\">\n        <div class=\"kicker\">CONTINENTS<\u002Fdiv>\n        <div class=\"big-num\" data-count=\"6\" data-dur=\"900\">0<\u002Fdiv>\n        <div class=\"mono dim\">of seven<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"reach-stat\">\n        <div class=\"kicker warm\">NORTH AMERICA<\u002Fdiv>\n        <div class=\"big-num warm\" data-count=\"48\" data-dur=\"1500\">0<\u002Fdiv>\n        <div class=\"mono dim\">% of the dataset<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <p class=\"pull-serif mt-xl reveal d4\" style=\"max-width: 80ch;\">\n      The practice survives where the practice happens. Look closer.\n    <\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===================== ACT 05 · REACH · NORTH AMERICA ===================== -->\n<section class=\"act\" data-screen-label=\"05 Reach · N. America\" data-harmonic-hero=\"\" style=\"background: var(--bg-soft);\">\n  <div class=\"center\">\n    <div class=\"reveal mono hot\" style=\"font-size:20px; letter-spacing:0.18em;\">[ ACT 03 · ZOOM · NORTH AMERICA ]<\u002Fdiv>\n    <h2 class=\"title-l reveal d1 mt-l\">216 of the 452&nbsp;live where the consent form is the&nbsp;<span class=\"serif\" style=\"font-style:italic; color: var(--hot);\">default<\u002Fspan>.<\u002Fh2>\n    <p class=\"body mt-l reveal d2 dim\" style=\"max-width: 64ch;\">\n      The United States and Canada — the two industrialized nations where routine infant circumcision is still common — account for nearly half of every voice in this report. That isn't a sampling bias. It's the shape of who needs to talk about this.\n    <\u002Fp>\n\n    <div class=\"row mt-xl reveal d3\" style=\"justify-content: center; gap: 5rem; align-items: flex-end;\">\n      <div class=\"txt-center\">\n        <div class=\"kicker hot\">UNITED STATES<\u002Fdiv>\n        <div class=\"big-num hot\" data-count=\"175\">0<\u002Fdiv>\n        <div class=\"mono dim\">39% of dataset<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"txt-center\">\n        <div class=\"kicker warm\">CANADA<\u002Fdiv>\n        <div class=\"big-num warm\" data-count=\"41\">0<\u002Fdiv>\n        <div class=\"mono dim\">9% of dataset<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"txt-center\">\n        <div class=\"kicker cool\">EVERYWHERE ELSE<\u002Fdiv>\n        <div class=\"big-num cool\" data-count=\"236\">0<\u002Fdiv>\n        <div class=\"mono dim\">52% · 33 countries<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <p class=\"pull-serif mt-xl reveal d4\" style=\"max-width: 80ch;\">\n      Now meet the people behind the dots.\n    <\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===================== ACT 06 · WHO ANSWERED ===================== -->\n<section class=\"act\" data-screen-label=\"06 Who Answered\">\n  <div class=\"center\">\n    <div class=\"reveal mono ink\" style=\"font-size:20px; letter-spacing:0.18em;\">[ ACT 03 · WHO ANSWERED ]<\u002Fdiv>\n    <h2 class=\"title-l reveal d1 mt-l\">452 people&nbsp;said&nbsp;<span class=\"serif\" style=\"font-style:italic; color: var(--warm);\">yes<\u002Fspan>&nbsp;to a&nbsp;368-question survey&nbsp;about&nbsp;a part of the body our culture has agreed not to discuss.<\u002Fh2>\n\n    <p class=\"body mt-l reveal d2 dim\">\n      Each dot below is one of them. They are not activists. Most found the survey through curiosity, through a partner, through a quiet question they had carried for years.\n    <\u002Fp>\n\n    <div class=\"reveal d2 mt-xl\" data-dotplot=\"\" data-n=\"452\" data-cols=\"40\" data-intact=\"129\" data-circ=\"185\" data-restor=\"93\" data-dotmode=\"by-state\"><\u002Fdiv>\n\n    <div class=\"mt-xl row gap-l\">\n      <div class=\"reveal d1\" style=\"min-width: 220px;\">\n        <div class=\"mono uppercase dim\" style=\"font-size:14px;\">CIRCUMCISION STATE<\u002Fdiv>\n        <div class=\"mt-l col gap-s\">\n          <div class=\"between\"><span class=\"mono cool\">● Intact<\u002Fspan><span class=\"mono cool\">129<\u002Fspan><\u002Fdiv>\n          <div class=\"between\"><span class=\"mono hot\">● Circumcised<\u002Fspan><span class=\"mono hot\">185<\u002Fspan><\u002Fdiv>\n          <div class=\"between\"><span class=\"mono warm\">● Restoring<\u002Fspan><span class=\"mono warm\">93<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"reveal d2\" style=\"min-width: 220px;\">\n        <div class=\"mono uppercase dim\" style=\"font-size:14px;\">GENERATION<\u002Fdiv>\n        <div class=\"mt-l col gap-s\">\n          <div class=\"between mono\"><span class=\"dim\">Millennial<\u002Fspan><span class=\"ink\">181<\u002Fspan><\u002Fdiv>\n          <div class=\"between mono\"><span class=\"dim\">Gen Z<\u002Fspan><span class=\"ink\">123<\u002Fspan><\u002Fdiv>\n          <div class=\"between mono\"><span class=\"dim\">Gen X<\u002Fspan><span class=\"ink\">59<\u002Fspan><\u002Fdiv>\n          <div class=\"between mono\"><span class=\"dim\">Boomer<\u002Fspan><span class=\"ink\">42<\u002Fspan><\u002Fdiv>\n          <div class=\"between mono\"><span class=\"dim\">Xennial<\u002Fspan><span class=\"ink\">25<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"reveal d3\" style=\"min-width: 220px;\">\n        <div class=\"mono uppercase dim\" style=\"font-size:14px;\">TOP COUNTRIES<\u002Fdiv>\n        <div class=\"mt-l col gap-s\">\n          <div class=\"between mono\"><span class=\"dim\">United States<\u002Fspan><span class=\"ink\">175<\u002Fspan><\u002Fdiv>\n          <div class=\"between mono\"><span class=\"dim\">Canada<\u002Fspan><span class=\"ink\">41<\u002Fspan><\u002Fdiv>\n          <div class=\"between mono\"><span class=\"dim\">Australia<\u002Fspan><span class=\"ink\">24<\u002Fspan><\u002Fdiv>\n          <div class=\"between mono\"><span class=\"dim\">United Kingdom<\u002Fspan><span class=\"ink\">23<\u002Fspan><\u002Fdiv>\n          <div class=\"between mono\"><span class=\"dim\">Germany<\u002Fspan><span class=\"ink\">10<\u002Fspan><\u002Fdiv>\n          <div class=\"between mono\"><span class=\"dim\">31 others<\u002Fspan><span class=\"ink\">79<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"reveal d4\" style=\"min-width: 220px;\">\n        <div class=\"mono uppercase dim\" style=\"font-size:14px;\">SEXUALITY (TOP 4)<\u002Fdiv>\n        <div class=\"mt-l col gap-s\">\n          <div class=\"between mono\"><span class=\"dim\">Straight<\u002Fspan><span class=\"ink\">180<\u002Fspan><\u002Fdiv>\n          <div class=\"between mono\"><span class=\"dim\">Gay<\u002Fspan><span class=\"ink\">109<\u002Fspan><\u002Fdiv>\n          <div class=\"between mono\"><span class=\"dim\">Bisexual<\u002Fspan><span class=\"ink\">71<\u002Fspan><\u002Fdiv>\n          <div class=\"between mono\"><span class=\"dim\">Pansexual<\u002Fspan><span class=\"ink\">17<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===================== ACT 05 · THE PATHWAYS ===================== -->\n<section class=\"act\" data-screen-label=\"07 The Pathways\">\n  <div class=\"center\">\n    <div class=\"reveal mono ink\" style=\"font-size:20px; letter-spacing:0.18em;\">[ ACT 04 · SIX PATHWAYS ]<\u002Fdiv>\n    <h2 class=\"title-l reveal d1 mt-l\">The inquiry asks the same question from six different angles.<\u002Fh2>\n    <p class=\"body mt-l reveal d2 dim\">Three of those angles are the body itself. The other three are the people who orbit it: partners, parents, and the professionals who hand them the consent form.<\u002Fp>\n\n    <div class=\"mt-xl\" style=\"display:grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem;\">\n      <div class=\"reveal d1 crt-frame\">\n        <span class=\"corner tl\"><\u002Fspan><span class=\"corner tr\"><\u002Fspan><span class=\"corner bl\"><\u002Fspan><span class=\"corner br\"><\u002Fspan>\n        <div class=\"mono cool\" style=\"font-size: 16px; letter-spacing: 0.15em;\">PATHWAY · INT<\u002Fdiv>\n        <div class=\"title-m mt-l\" style=\"color: var(--cool);\">Intact<\u002Fdiv>\n        <p class=\"body mt-l\">Never circumcised. The default state of a male body. The baseline against which everything else is, definitionally, a deviation.<\u002Fp>\n        <div data-art=\"concentric\" data-size=\"200\" data-n=\"14\" data-color=\"stroke cool\" data-weight=\"0.6\" class=\"mt-l\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"reveal d2 crt-frame\">\n        <span class=\"corner tl\"><\u002Fspan><span class=\"corner tr\"><\u002Fspan><span class=\"corner bl\"><\u002Fspan><span class=\"corner br\"><\u002Fspan>\n        <div class=\"mono hot\" style=\"font-size: 16px; letter-spacing: 0.15em;\">PATHWAY · CIR<\u002Fdiv>\n        <div class=\"title-m mt-l\" style=\"color: var(--hot);\">Circumcised<\u002Fdiv>\n        <p class=\"body mt-l\">Cut, typically in infancy, without their knowledge or consent. Most never see the procedure, and most are never told what was taken.<\u002Fp>\n        <div data-art=\"spiro\" data-size=\"200\" data-r=\"80\" data-subr=\"29\" data-d=\"48\" data-loops=\"34\" data-color=\"stroke hot\" data-weight=\"0.55\" class=\"mt-l\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"reveal d3 crt-frame\">\n        <span class=\"corner tl\"><\u002Fspan><span class=\"corner tr\"><\u002Fspan><span class=\"corner bl\"><\u002Fspan><span class=\"corner br\"><\u002Fspan>\n        <div class=\"mono warm\" style=\"font-size: 16px; letter-spacing: 0.15em;\">PATHWAY · RES<\u002Fdiv>\n        <div class=\"title-m mt-l\" style=\"color: var(--warm);\">Restoring<\u002Fdiv>\n        <p class=\"body mt-l\">Actively rebuilding the foreskin tissue removed in infancy. A years-long act of bodily reclamation. 93 respondents are doing it now.<\u002Fp>\n        <div data-art=\"liss\" data-size=\"200\" data-a=\"3\" data-b=\"5\" data-color=\"stroke warm\" data-weight=\"0.6\" class=\"mt-l\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"mt-l\" style=\"display:grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem;\">\n      <div class=\"reveal d2\" style=\"border:1px dashed var(--rule); padding: 1.4rem;\">\n        <div class=\"mono dim\" style=\"font-size: 16px; letter-spacing: 0.15em;\">PATHWAY · PAR<\u002Fdiv>\n        <div class=\"title-m mt-l\">Partners<\u002Fdiv>\n        <p class=\"body mt-l dim\">Witnesses to the practice from the outside in.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"reveal d3\" style=\"border:1px dashed var(--rule); padding: 1.4rem;\">\n        <div class=\"mono dim\" style=\"font-size: 16px; letter-spacing: 0.15em;\">PATHWAY · PRT<\u002Fdiv>\n        <div class=\"title-m mt-l\">Parents<\u002Fdiv>\n        <p class=\"body mt-l dim\">Made the decision — or are in the middle of making it.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"reveal d4\" style=\"border:1px dashed var(--rule); padding: 1.4rem;\">\n        <div class=\"mono dim\" style=\"font-size: 16px; letter-spacing: 0.15em;\">PATHWAY · PRO<\u002Fdiv>\n        <div class=\"title-m mt-l\">Professionals<\u002Fdiv>\n        <p class=\"body mt-l dim\">Clinicians, researchers, advocates inside the system.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===================== ACT 06 · THE PLEASURE GAP ===================== -->\n<section class=\"act sticky-wrap taller\" data-screen-label=\"08 Pleasure Gap\" data-gap-wrap=\"\">\n  <div class=\"sticky\">\n    <div class=\"center\">\n      <div class=\"sticky-head\">\n        <div class=\"kicker\" style=\"font-size: 16px;\">[ ACT 0 "val\">41%<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"gap-row show\">\n        <div class=\"lbl warm\">Restoring<\u002Fdiv>\n        <div class=\"gap-bars\" style=\"height:32px;\">\n          <div class=\"gap-bar restor\" style=\"width: 16%; opacity:1; top: 6px; height: 20px;\"><span class=\"val\">8%<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"gap-row show\">\n        <div class=\"lbl hot\">Circumcised<\u002Fdiv>\n        <div class=\"gap-bars\" style=\"height:32px;\">\n          <div class=\"gap-bar circ\" style=\"width: 16%; opacity:1; top: 6px; height: 20px;\"><span class=\"val\">8%<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"mt-xl reveal d3\">\n      <div class=\"mono dim mb-l\" style=\"letter-spacing: 0.10em;\">% VERY DISSATISFIED<\u002Fdiv>\n      <div class=\"gap-row show\">\n        <div class=\"lbl cool\">Intact<\u002Fdiv>\n        <div class=\"gap-bars\" style=\"height:32px;\">\n          <div class=\"gap-bar intact\" style=\"width: 2%; opacity:1; top: 6px; height: 20px;\"><span class=\"val\">1%<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"gap-row show\">\n        <div class=\"lbl warm\">Restoring<\u002Fdiv>\n        <div class=\"gap-bars\" style=\"height:32px;\">\n          <div class=\"gap-bar restor\" style=\"width: 48%; opacity:1; top: 6px; height: 20px;\"><span class=\"val\">24%<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"gap-row show\">\n        <div class=\"lbl hot\">Circumcised<\u002Fdiv>\n        <div class=\"gap-bars\" style=\"height:32px;\">\n          <div class=\"gap-bar circ\" style=\"width: 62%; opacity:1; top: 6px; height: 20px;\"><span class=\"val\">31%<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <p class=\"pull-serif mt-xl reveal d4\" style=\"max-width: 860px;\">\n      Forty-one out of every hundred intact men say they are very proud of their bodies. Among circumcised men, that number is eight. <span class=\"hot\">Eight.<\u002Fspan>\n    <\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===================== ACT 15 · TRANSPARENT MONSTER ===================== -->\n<section class=\"act\" data-screen-label=\"17 The Transparent Monster\" data-harmonic-hero=\"\">\n  <div class=\"center\">\n    <div class=\"reveal mono hot\" style=\"font-size:20px; letter-spacing:0.18em;\">[ ACT 12 · THE METAPHOR ]<\u002Fdiv>\n    <h2 class=\"title-xl reveal d1 mt-l\" style=\"text-wrap: balance;\">\n      We asked the 452: does the phrase&nbsp;\n      <span class=\"serif\" style=\"font-style:italic; color: var(--hot);\">\"transparent&nbsp;monster\"<\u002Fspan>&nbsp;\n      — a significant harm hiding in plain sight — describe what you've experienced?\n    <\u002Fh2>\n\n    <div class=\"row mt-xl gap-xl\" style=\"align-items: flex-end; justify-content: center;\">\n      <div class=\"reveal d2 txt-center\">\n        <div class=\"kicker hot\">RESONATES STRONGLY<\u002Fdiv>\n        <div class=\"big-num hot\" data-count=\"56\">0<\u002Fdiv>\n        <div class=\"mono dim\">%<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"reveal d3 txt-center\">\n        <div class=\"kicker warm\">RESONATES SOMEWHAT<\u002Fdiv>\n        <div class=\"big-num warm\" data-count=\"21\">0<\u002Fdiv>\n        <div class=\"mono dim\">%<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"reveal d4 txt-center\">\n        <div class=\"kicker dim\">DOES NOT<\u002Fdiv>\n        <div class=\"big-num\" style=\"color: var(--fg-dim);\" data-count=\"7\">0<\u002Fdiv>\n        <div class=\"mono dim\">%<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <p class=\"pull-serif mt-xl reveal d5 txt-center\" style=\"max-width: 980px; margin-left:auto; margin-right:auto;\">\n      Better than three of every four respondents agree:<br>\n      the thing in the room is real, and it has been there the whole time.\n    <\u002Fp>\n\n    <div class=\"row mt-xl\" style=\"align-items: flex-start; justify-content: center;\">\n      <div class=\"quote-card reveal d2\">\n        <div class=\"q\">Circumcision is a euphemism. It sounds easy — something everyone does. But \"partial genital amputation\" sounds like something no one would do.<\u002Fdiv>\n        <div class=\"src\">— Restoring<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"quote-card reveal d3\">\n        <div class=\"q\">I see it as a thick blanket that we are forced to pretend is whatever.<\u002Fdiv>\n        <div class=\"src\">— Restoring<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"quote-card reveal d4\">\n        <div class=\"q\">Male suffering is ignored and normalized.<\u002Fdiv>\n        <div class=\"src\">— Restoring<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===================== ACT 16 · AUTONOMY ===================== -->\n<section class=\"act short\" data-screen-label=\"18 Autonomy\">\n  <div class=\"center txt-center\">\n    <div class=\"reveal kicker\">[ ACT 13 · IF GIVEN THE CHOICE TODAY ]<\u002Fdiv>\n    <h2 class=\"title-xl reveal d1 mt-l\">87%<\u002Fh2>\n    <p class=\"pull-serif reveal d2 mt-l\" style=\"max-width: 880px; margin: 0 auto;\">\n      of respondents say bodily autonomy — the child's right to grow up and make this decision themselves — should be the principle that wins.\n    <\u002Fp>\n    <p class=\"body reveal d3 mt-l dim\" style=\"max-width: 56ch; margin: 0 auto;\">\n      Nine percent said medical authority and parental discretion. The remainder were unsure. Across every demographic, every generation, every state — the autonomy principle is overwhelming.\n    <\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===================== ACT 17 · CALL TO ACTION ===================== -->\n<section class=\"act\" data-screen-label=\"19 The Inquiry Continues\" data-harmonic-hero=\"\">\n  <div class=\"center\">\n    <div class=\"reveal kicker\">[ THE INQUIRY CONTINUES ]<\u002Fdiv>\n    <h2 class=\"title-xl reveal d1 mt-l\">\n      This is phase one.<br>\n      <span class=\"ink\">Five hundred is just the start.<\u002Fspan>\n    <\u002Fh2>\n    <p class=\"body mt-l reveal d2\" style=\"max-width: 60ch;\">\n      The Accidental Intactivist's Inquiry is ongoing. Every additional voice — intact, circumcised, restoring, partner, parent, professional — sharpens the signal, and weakens the silence the practice depends on.\n    <\u002Fp>\n    <p class=\"body mt-l reveal d2\" style=\"max-width: 60ch;\">\n      If you carry a story, a question, a body that has been changed without your consent, or one that hasn't — the survey is open. It always will be.\n    <\u002Fp>\n\n    <div class=\"row mt-xl reveal d3\" style=\"align-items: center;\">\n      <a class=\"cta-btn\" href=\"https://circumsurvey.online\" target=\"_blank\" rel=\"noopener\">TAKE THE SURVEY<\u002Fa>\n      <a class=\"cta-btn\" href=\"https://findings.circumsurvey.online/explore\" target=\"_blank\" rel=\"noopener\" style=\"border-color: var(--warm); color: var(--warm);\">EXPLORE THE DATA<\u002Fa>\n    <\u002Fdiv>\n\n    <div class=\"mt-xl reveal d4\">\n      <div data-art=\"spiro\" data-size=\"320\" data-r=\"100\" data-subr=\"22\" data-d=\"70\" data-loops=\"50\" data-color=\"stroke\" data-weight=\"0.4\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fmain>\n\n<!-- ===================== FOOTER ===================== -->\n<footer class=\"foot\">\n  <div class=\"cols\">\n    <div>\n      <div class=\"mono ink uppercase\" style=\"letter-spacing: 0.16em; margin-bottom: 1rem;\">CIRCUMSURVEY · FINDINGS · PHASE 01<\u002Fdiv>\n      <p style=\"max-width: 56ch; line-height: 1.6;\">\n        A scrollytelling report on the first 452 responses to <em>The Accidental Intactivist's Inquiry<\u002Fem> — a 368-question instrument exploring lived experience, perception, and cultural framing of non-therapeutic infant circumcision across 35 countries.\n      <\u002Fp>\n      <p style=\"margin-top: 1rem; line-height: 1.6;\">\n        All numbers are computed directly from the raw response data. Quotes are verbatim, with state and approximate age preserved.\n      <\u002Fp>\n    <\u002Fdiv>\n    <div>\n      <div class=\"mono ink uppercase\" style=\"letter-spacing:0.16em; margin-bottom: 1rem;\">LINKS<\u002Fdiv>\n      <p><a href=\"https://circumsurvey.online\">Take the survey<\u002Fa><\u002Fp>\n      <p><a href=\"https://circumsurvey.online/about\">About the inquiry<\u002Fa><\u002Fp>\n      <p><a href=\"https://findings.circumsurvey.online\">Findings home<\u002Fa><\u002Fp>\n      <p><a href=\"https://findings.circumsurvey.online/explore\">Explore the data<\u002Fa><\u002Fp>\n    <\u002Fdiv>\n    <div>\n      <div class=\"mono ink uppercase\" style=\"letter-spacing:0.16em; margin-bottom: 1rem;\">COLOPHON<\u002Fdiv>\n      <p>Type · VT323 / Space Grotesk / Instrument Serif<\u002Fp>\n      <p style=\"margin-top: 0.6rem;\">Themes · Phosphor / Amber / PBS / Paper / Mono<\u002Fp>\n      <p style=\"margin-top: 0.6rem;\">Art · spirograph, moiré, line-fields generated in-browser<\u002Fp>\n      <p style=\"margin-top: 0.6rem;\">© 2025 The Accidental Intactivist<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<script src=\"95d2c497-1e22-40a7-9919-c4181cd2a441\"><\u002Fscript>\n<script src=\"7e222bd3-44cc-4943-a9a6-7211a057cc96\"><\u002Fscript>\n<script src=\"eb937ae2-6fed-4866-91b9-fa5270ef7191\"><\u002Fscript>\n<script src=\"ebc3d6ae-7511-4310-8776-f6bdfd489a13\"><\u002Fscript>\n<script src=\"9f849856-df2e-471c-a9e9-830d40d010d7\"><\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
