<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c1222"/>
      <stop offset="100%" stop-color="#060913"/>
    </linearGradient>
    <linearGradient id="metal2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="danger" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="500" fill="url(#bg2)"/>
  
  <!-- Blueprint Grid -->
  <g stroke="rgba(56, 189, 248, 0.07)" stroke-width="1">
    <line x1="50" y1="50" x2="750" y2="50"/>
    <line x1="50" y1="120" x2="750" y2="120"/>
    <line x1="50" y1="190" x2="750" y2="190"/>
    <line x1="50" y1="260" x2="750" y2="260"/>
    <line x1="50" y1="330" x2="750" y2="330"/>
    <line x1="50" y1="400" x2="750" y2="400"/>
    <line x1="120" y1="50" x2="120" y2="420"/>
    <line x1="220" y1="50" x2="220" y2="420"/>
    <line x1="320" y1="50" x2="320" y2="420"/>
    <line x1="420" y1="50" x2="420" y2="420"/>
    <line x1="520" y1="50" x2="520" y2="420"/>
    <line x1="620" y1="50" x2="620" y2="420"/>
    <line x1="720" y1="50" x2="720" y2="420"/>
  </g>

  <!-- Outer Blueprint Border -->
  <rect x="25" y="25" width="750" height="450" fill="none" stroke="rgba(212, 160, 48, 0.4)" stroke-width="2"/>
  <rect x="30" y="30" width="740" height="440" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

  <!-- Header Plate -->
  <text x="50" y="55" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="16" font-weight="bold" fill="#facc15" letter-spacing="1">MOGEN CIRCUMCISION CLAMP (BRONSTEIN 1954)</text>
  <text x="50" y="74" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8" letter-spacing="0.5">TECHNICAL CROSS-SECTION &amp; BLIND-SLIT SAFETY ARCHITECTURE</text>
  <line x1="50" y1="84" x2="750" y2="84" stroke="rgba(212, 160, 48, 0.3)" stroke-width="1"/>

  <!-- MECHANICAL DRAWING: Mogen Clamp Guillotine Slit -->
  <g transform="translate(100, 110)">
    <!-- Base Jaws / Slotted Platform -->
    <path d="M 50,220 L 380,220 L 390,260 L 40,260 Z" fill="url(#metal2)" stroke="#e2e8f0" stroke-width="1.5"/>

    <!-- Slotted Aperture (2.5mm Gap) -->
    <rect x="180" y="210" width="10" height="55" fill="#0f172a" stroke="#ef4444" stroke-width="2"/>
    <line x1="185" y1="180" x2="185" y2="275" stroke="#ef4444" stroke-width="1" stroke-dasharray="2,2"/>

    <!-- Hinged Upper Compression Blade -->
    <!-- Pivot Pin -->
    <circle cx="70" cy="180" r="12" fill="#0f172a" stroke="#facc15" stroke-width="2"/>
    <circle cx="70" cy="180" r="5" fill="#facc15"/>

    <!-- Upper Arm angled down -->
    <path d="M 70,170 L 340,195 L 340,215 L 70,190 Z" fill="url(#metal2)" stroke="#e2e8f0" stroke-width="1.5"/>

    <!-- Handle Lever Extension -->
    <path d="M 340,195 L 440,180 L 445,195 L 340,215 Z" fill="url(#metal2)" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="440" cy="188" r="8" fill="#d4a030" stroke="#fff" stroke-width="1"/>

    <!-- Scalpel Excision Line (Top of Blade) -->
    <line x1="170" y1="195" x2="200" y2="195" stroke="#38bdf8" stroke-width="3"/>
    <polygon points="205,195 195,191 195,199" fill="#38bdf8"/>

    <!-- Danger Zone: Glans Entrapment Area (Behind Slit) -->
    <path d="M 140,240 C 140,225 170,220 185,225 C 185,235 170,250 140,255 Z" fill="rgba(239, 68, 68, 0.35)" stroke="#ef4444" stroke-width="2" stroke-dasharray="3,3"/>
  </g>

  <!-- Technical Annotations -->
  <!-- Callout 1: 2.5 mm Slit -->
  <line x1="285" y1="300" x2="210" y2="340" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="110" y="340" width="180" height="42" fill="#0f172a" stroke="#ef4444" stroke-width="1" rx="4"/>
  <text x="120" y="357" font-family="'Inter', sans-serif" font-size="10" font-weight="bold" fill="#f87171">1. Narrow 2.5 mm Slit</text>
  <text x="120" y="372" font-family="'Inter', sans-serif" font-size="9" fill="#cbd5e1">Prepuce drawn through blindly</text>

  <!-- Callout 2: Glans Entrapment -->
  <line x1="240" y1="340" x2="350" y2="340" stroke="#f43f5e" stroke-width="1.5"/>
  <rect x="330" y="325" width="220" height="52" fill="#0f172a" stroke="#f43f5e" stroke-width="1" rx="4"/>
  <text x="340" y="342" font-family="'Inter', sans-serif" font-size="10" font-weight="bold" fill="#f87171">2. Blind Entrapment Danger Zone</text>
  <text x="340" y="356" font-family="'Inter', sans-serif" font-size="9" fill="#cbd5e1">No protective bell inside lumen;</text>
  <text x="340" y="368" font-family="'Inter', sans-serif" font-size="9" fill="#94a3b8">FDA alert: glans partial/total amputation</text>

  <!-- Callout 3: Scalpel Slice -->
  <line x1="280" y1="210" x2="330" y2="160" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="340" y="145" width="160" height="34" fill="#0f172a" stroke="#38bdf8" stroke-width="1" rx="4"/>
  <text x="350" y="160" font-family="'Inter', sans-serif" font-size="10" font-weight="bold" fill="#38bdf8">3. Flush Scalpel Excision</text>
  <text x="350" y="172" font-family="'Inter', sans-serif" font-size="9" fill="#94a3b8">Blade skims directly on clamp face</text>

  <!-- Specifications Card (Right) -->
  <rect x="580" y="110" width="170" height="230" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(212, 160, 48, 0.4)" stroke-width="1" rx="6"/>
  <text x="595" y="132" font-family="'Cinzel', serif" font-size="11" font-weight="bold" fill="#facc15">DEVICE SPECIFICATIONS</text>
  
  <text x="595" y="155" font-family="'Inter', sans-serif" font-size="9" font-weight="bold" fill="#cbd5e1">Action Mechanism:</text>
  <text x="595" y="168" font-family="'Inter', sans-serif" font-size="9" fill="#94a3b8">Guillotine / Slit Crush (90s)</text>

  <text x="595" y="190" font-family="'Inter', sans-serif" font-size="9" font-weight="bold" fill="#cbd5e1">Clinical Popularity:</text>
  <text x="595" y="203" font-family="'Inter', sans-serif" font-size="9" fill="#94a3b8">65% obstetric preference (speed)</text>

  <text x="595" y="225" font-family="'Inter', sans-serif" font-size="9" font-weight="bold" fill="#cbd5e1">FDA Warning:</text>
  <text x="595" y="238" font-family="'Inter', sans-serif" font-size="9" fill="#f87171">FDA Public Health Notice (2000)</text>

  <text x="595" y="260" font-family="'Inter', sans-serif" font-size="9" font-weight="bold" fill="#cbd5e1">Known Malpractice:</text>
  <text x="595" y="273" font-family="'Inter', sans-serif" font-size="9" fill="#f87171">High tort frequency for glans</text>
  <text x="595" y="285" font-family="'Inter', sans-serif" font-size="9" fill="#f87171">coronal denudation/amputation</text>

  <text x="595" y="308" font-family="'Inter', sans-serif" font-size="8" font-style="italic" fill="#64748b">Archive Record: FDA-MHN-2000</text>
  <text x="595" y="322" font-family="'Inter', sans-serif" font-size="8" font-style="italic" fill="#64748b">Collection: Intactivism Primary</text>

  <!-- Footer Citation Banner -->
  <rect x="50" y="425" width="700" height="35" fill="rgba(0, 0, 0, 0.4)" stroke="rgba(255, 255, 255, 0.08)" rx="4"/>
  <text x="65" y="446" font-family="'Inter', sans-serif" font-size="10" fill="#cbd5e1">
    FIG 1.2 — Mogen Clamp Mechanical Cross-Section &amp; Blind Slit Failure Mode. Provenance: FDA Medical Device Notification (2000).
  </text>
</svg>
