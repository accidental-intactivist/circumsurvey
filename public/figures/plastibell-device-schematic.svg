<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c1222"/>
      <stop offset="100%" stop-color="#060913"/>
    </linearGradient>
    <linearGradient id="plastic" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#bae6fd" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="gold3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d4a030"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="500" fill="url(#bg3)"/>
  
  <!-- Blueprint Grid -->
  <g stroke="rgba(56, 189, 248, 0.07)" stroke-width="1">
    <line x1="50" y1="50" x2="750" y2="50"/>
    <line x1="50" y1="120" x2="750" y2="120"/>
    <line x1="50" y1="190" x2="750" y2="190"/>
    <line x1="50" y1="260" x2="750" y2="260"/>
    <line x1="50" y1="330" x2="750" y2="330"/>
    <line x1="50" y1="400" x2="750" y2="400"/>
    <line x1="120" y1="50" x2="120" y2="420"/>
    <line x1="220" y1="50" x2="220" y2="420"/>
    <line x1="320" y1="50" x2="320" y2="420"/>
    <line x1="420" y1="50" x2="420" y2="420"/>
    <line x1="520" y1="50" x2="520" y2="420"/>
    <line x1="620" y1="50" x2="620" y2="420"/>
    <line x1="720" y1="50" x2="720" y2="420"/>
  </g>

  <!-- Outer Blueprint Border -->
  <rect x="25" y="25" width="750" height="450" fill="none" stroke="rgba(212, 160, 48, 0.4)" stroke-width="2"/>
  <rect x="30" y="30" width="740" height="440" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

  <!-- Header Plate -->
  <text x="50" y="55" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="16" font-weight="bold" fill="#facc15" letter-spacing="1">PLASTIBELL CIRCUMCISION DEVICE (HOLLISTER)</text>
  <text x="50" y="74" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8" letter-spacing="0.5">ISCHEMIC NECROSIS LIGATURE &amp; PROXIMAL MIGRATION RISK PROFILE</text>
  <line x1="50" y1="84" x2="750" y2="84" stroke="rgba(212, 160, 48, 0.3)" stroke-width="1"/>

  <!-- TECHNICAL DRAWING: Plastibell Structure -->
  <g transform="translate(140, 110)">
    <!-- Break-Away Plastic Handle -->
    <path d="M 60,190 L 170,190 L 170,210 L 60,210 Z" fill="url(#plastic)" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="165" y1="180" x2="165" y2="220" stroke="#f43f5e" stroke-width="2" stroke-dasharray="3,3"/>
    <text x="110" y="203" font-family="'JetBrains Mono', monospace" font-size="9" fill="#e2e8f0" text-anchor="middle">SNAP-OFF HANDLE</text>

    <!-- Plastic Ring / Bell Body -->
    <path d="M 170,175 C 200,165 240,165 270,175 L 290,210 C 270,230 200,230 170,210 Z" fill="url(#plastic)" stroke="#38bdf8" stroke-width="2"/>

    <!-- Circumferential Groove -->
    <ellipse cx="230" cy="195" rx="35" ry="18" fill="none" stroke="#facc15" stroke-width="2.5"/>

    <!-- Heavy Braided Cotton / Silk Ligature Cord -->
    <ellipse cx="230" cy="195" rx="35" ry="18" fill="none" stroke="#ef4444" stroke-width="3" stroke-dasharray="4,2"/>
    <!-- Ligature Knot -->
    <circle cx="265" cy="195" r="5" fill="#ef4444" stroke="#fff" stroke-width="1.5"/>
    <line x1="265" y1="195" x2="285" y2="180" stroke="#ef4444" stroke-width="2"/>
    <line x1="265" y1="195" x2="285" y2="210" stroke="#ef4444" stroke-width="2"/>

    <!-- Ischemic Strangulation Zone -->
    <ellipse cx="230" cy="210" rx="38" ry="12" fill="rgba(239, 68, 68, 0.2)" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="2,2"/>
  </g>

  <!-- Technical Annotations -->
  <!-- Callout 1: Ligature Compression -->
  <line x1="405" y1="305" x2="440" y2="340" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="360" y="340" width="190" height="42" fill="#0f172a" stroke="#ef4444" stroke-width="1" rx="4"/>
  <text x="370" y="357" font-family="'Inter', sans-serif" font-size="10" font-weight="bold" fill="#f87171">1. Strangulation Ligature</text>
  <text x="370" y="371" font-family="'Inter', sans-serif" font-size="9" fill="#cbd5e1">Cuts off all distal vascular supply</text>

  <!-- Callout 2: Sloughing Zone -->
  <line x1="370" y1="320" x2="260" y2="350" stroke="#facc15" stroke-width="1.5"/>
  <rect x="130" y="350" width="190" height="42" fill="#0f172a" stroke="#facc15" stroke-width="1" rx="4"/>
  <text x="140" y="367" font-family="'Inter', sans-serif" font-size="10" font-weight="bold" fill="#facc15">2. Ischemic Dry Gangrene</text>
  <text x="140" y="381" font-family="'Inter', sans-serif" font-size="9" fill="#cbd5e1">5–8 day prolonged necrosis</text>

  <!-- Callout 3: Break notch -->
  <line x1="305" y1="285" x2="240" y2="240" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="80" y="215" width="150" height="34" fill="#0f172a" stroke="#38bdf8" stroke-width="1" rx="4"/>
  <text x="90" y="230" font-family="'Inter', sans-serif" font-size="10" font-weight="bold" fill="#38bdf8">3. Handle Snap Point</text>
  <text x="90" y="242" font-family="'Inter', sans-serif" font-size="9" fill="#94a3b8">Broke flush after tying</text>

  <!-- Specifications Card (Right) -->
  <rect x="580" y="110" width="170" height="230" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(212, 160, 48, 0.4)" stroke-width="1" rx="6"/>
  <text x="595" y="132" font-family="'Cinzel', serif" font-size="11" font-weight="bold" fill="#facc15">DEVICE SPECIFICATIONS</text>
  
  <text x="595" y="155" font-family="'Inter', sans-serif" font-size="9" font-weight="bold" fill="#cbd5e1">Action Mechanism:</text>
  <text x="595" y="168" font-family="'Inter', sans-serif" font-size="9" fill="#94a3b8">Ischemic Strangulation Necrosis</text>

  <text x="595" y="190" font-family="'Inter', sans-serif" font-size="9" font-weight="bold" fill="#cbd5e1">Duration In Situ:</text>
  <text x="595" y="203" font-family="'Inter', sans-serif" font-size="9" fill="#94a3b8">5 to 8 days post-procedure</text>

  <text x="595" y="225" font-family="'Inter', sans-serif" font-size="9" font-weight="bold" fill="#cbd5e1">Primary Risk Profile:</text>
  <text x="595" y="238" font-family="'Inter', sans-serif" font-size="9" fill="#f87171">Proximal Ring Migration</text>

  <text x="595" y="260" font-family="'Inter', sans-serif" font-size="9" font-weight="bold" fill="#cbd5e1">Complication Rates:</text>
  <text x="595" y="273" font-family="'Inter', sans-serif" font-size="9" fill="#f87171">Penile shaft impaction,</text>
  <text x="595" y="285" font-family="'Inter', sans-serif" font-size="9" fill="#f87171">urinary retention, edema</text>

  <text x="595" y="308" font-family="'Inter', sans-serif" font-size="8" font-style="italic" fill="#64748b">Archive Record: Hollister Device</text>
  <text x="595" y="322" font-family="'Inter', sans-serif" font-size="8" font-style="italic" fill="#64748b">Collection: Intactivism Primary</text>

  <!-- Footer Citation Banner -->
  <rect x="50" y="425" width="700" height="35" fill="rgba(0, 0, 0, 0.4)" stroke="rgba(255, 255, 255, 0.08)" rx="4"/>
  <text x="65" y="446" font-family="'Inter', sans-serif" font-size="10" fill="#cbd5e1">
    FIG 1.3 — Hollister Plastibell Circumcision Device Schematic. Provenance: Pediatric Surgical Device Technical Dossier.
  </text>
</svg>
