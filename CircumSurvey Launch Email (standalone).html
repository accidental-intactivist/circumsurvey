document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html lang=\"en\" xmlns=\"http://www.w3.org/1999/xhtml\"><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<meta name=\"color-scheme\" content=\"light dark\">\n<meta name=\"supported-color-schemes\" content=\"light dark\">\n<title>CircumSurvey: Early Access to our Interactive Findings Report<\u002Ftitle>\n<style>\n  @media (max-width:620px){\n    .px{padding-left:24px !important; padding-right:24px !important;}\n    .stat{display:block !important; width:100% !important; border-left:0 !important; border-right:0 !important; padding:10px 0 !important;}\n    .h1{font-size:22px !important; line-height:28px !important;}\n  }\n  @media (prefers-color-scheme: dark){\n    .darkbar{background-color:#141418 !important;}\n  }\n<\u002Fstyle>\n\n<\u002Fhead>\n<body style=\"margin:0; padding:0; background-color:#efe8dc;\" bgcolor=\"#efe8dc\">\n  <!-- Preheader -->\n  <span style=\"display:none; font-size:1px; line-height:1px; max-height:0; max-width:0; opacity:0; overflow:hidden; color:#efe8dc;\">The Phase 1 Findings Hub is live — explore what 500+ respondents actually said.&nbsp;‌&nbsp;‌&nbsp;‌&nbsp;‌&nbsp;‌&nbsp;‌&nbsp;‌&nbsp;‌&nbsp;‌&nbsp;‌&nbsp;‌&nbsp;‌&nbsp;‌&nbsp;‌&nbsp;‌&nbsp;‌&nbsp;‌&nbsp;‌&nbsp;‌&nbsp;‌<\u002Fspan>\n\n  <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"100%\" bgcolor=\"#efe8dc\" style=\"background-color:#efe8dc;\">\n    <tbody><tr>\n      <td align=\"center\" style=\"padding:24px 12px;\">\n        <!--[if mso]><table role=\"presentation\" width=\"600\" align=\"center\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\"><tr><td><![endif]-->\n        <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"100%\" style=\"max-width:600px; width:100%;\">\n\n          <!-- Masthead: harmonic loom -->\n          <tbody><tr>\n            <td bgcolor=\"#f4eddd\" style=\"background-color:#f4eddd; padding:0; font-size:0; line-height:0;\">\n              <!-- Before sending: replace image srcs with hosted https URLs -->\n              <img src=\"6ef1fa41-1ea6-4533-ae01-c015c47e196c\" width=\"600\" alt=\"CircumSurvey.Online round star badge over the Harmonic Loom\" style=\"display:block; width:100%; max-width:600px; height:auto;\">\n            <\u002Ftd>\n          <\u002Ftr>\n          <tr>\n            <td align=\"center\" bgcolor=\"#f4eddd\" style=\"background-color:#f4eddd; padding:10px 40px 32px;\">\n              <div style=\"font-family:Arial, Helvetica, sans-serif; font-size:10px; line-height:14px; font-weight:bold; letter-spacing:3px; color:#8c6920; text-transform:uppercase; mso-line-height-rule:exactly;\">★&nbsp; Special Report &nbsp;★<\u002Fdiv>\n              <div class=\"h1\" style=\"font-family:Arial, Helvetica, sans-serif; font-size:28px; line-height:34px; font-weight:bold; letter-spacing:1px; text-transform:uppercase; color:#1f1e1a; padding-top:12px; mso-line-height-rule:exactly;\">The Accidental Intactivist's Inquiry<\u002Fdiv>\n            <\u002Ftd>\n          <\u002Ftr>\n\n          <!-- Rainbow rule -->\n          <tr>\n            <td style=\"padding:0;\">\n              <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"100%\">\n                <tbody><tr>\n                  <td width=\"20%\" bgcolor=\"#d94f4f\" style=\"height:3px; font-size:0; line-height:0;\">&nbsp;<\u002Ftd>\n                  <td width=\"20%\" bgcolor=\"#e8a44a\" style=\"height:3px; font-size:0; line-height:0;\">&nbsp;<\u002Ftd>\n                  <td width=\"20%\" bgcolor=\"#e8c868\" style=\"height:3px; font-size:0; line-height:0;\">&nbsp;<\u002Ftd>\n                  <td width=\"20%\" bgcolor=\"#68b878\" style=\"height:3px; font-size:0; line-height:0;\">&nbsp;<\u002Ftd>\n                  <td width=\"20%\" bgcolor=\"#5b93c7\" style=\"height:3px; font-size:0; line-height:0;\">&nbsp;<\u002Ftd>\n                <\u002Ftr>\n              <\u002Ftbody><\u002Ftable>\n            <\u002Ftd>\n          <\u002Ftr>\n\n          <!-- Hero -->\n          <tr>\n            <td class=\"px\" bgcolor=\"#faf6f0\" style=\"background-color:#faf6f0; padding:34px 44px 8px;\">\n              <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"100%\" bgcolor=\"#fffdf9\" style=\"background-color:#fffdf9; border:1px solid #c9a24a;\">\n                <tbody><tr>\n                  <td align=\"center\" style=\"padding:28px 26px 26px;\">\n                    <div style=\"font-family:Georgia, 'Times New Roman', serif; font-size:19px; line-height:26px; font-style:italic; color:#1f1e1a; mso-line-height-rule:exactly;\">Early access to our<\u002Fdiv>\n                    <div style=\"font-family:Arial, Helvetica, sans-serif; font-size:23px; line-height:29px; font-weight:bold; letter-spacing:1.5px; text-transform:uppercase; color:#8c6920; padding-top:6px; mso-line-height-rule:exactly;\">Interactive Findings Report<\u002Fdiv>\n                    <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" align=\"center\" style=\"margin:16px auto 14px;\">\n                      <tbody><tr><td width=\"44\" style=\"border-top:2px solid #c9a24a; font-size:0; line-height:0;\">&nbsp;<\u002Ftd><\u002Ftr>\n                    <\u002Ftbody><\u002Ftable>\n                    <div style=\"font-family:Arial, Helvetica, sans-serif; font-size:10px; line-height:16px; font-weight:bold; letter-spacing:2px; text-transform:uppercase; color:#514c42;\">500 people answered anonymously.<\u002Fdiv>\n                    <div style=\"font-family:Arial, Helvetica, sans-serif; font-size:10px; line-height:16px; font-weight:bold; letter-spacing:2px; text-transform:uppercase; color:#8c6920; padding-top:2px;\">Here's what they chose to share.<\u002Fdiv>\n                  <\u002Ftd>\n                <\u002Ftr>\n              <\u002Ftbody><\u002Ftable>\n            <\u002Ftd>\n          <\u002Ftr>\n\n          <!-- Letter -->\n          <tr>\n            <td class=\"px\" bgcolor=\"#faf6f0\" style=\"background-color:#faf6f0; padding:22px 44px 0;\">\n              <p style=\"margin:0 0 18px; font-family:Arial, Helvetica, sans-serif; font-size:15px; line-height:24px; color:#2e2c27;\">Hi [First Name],<\u002Fp>\n              <p style=\"margin:0 0 18px; font-family:Arial, Helvetica, sans-serif; font-size:15px; line-height:24px; color:#2e2c27;\">In America, we are raised with a very specific story about infant circumcision.<\u002Fp>\n              <p style=\"margin:0 0 18px; font-family:Arial, Helvetica, sans-serif; font-size:15px; line-height:24px; color:#2e2c27;\">We are told it is a minor, harmless hygiene upgrade. We are assured that it doesn't negatively impact sexual pleasure later in life. Above all, we are told that because it happens to a baby, they won’t remember it—and therefore, they won’t care.<\u002Fp>\n              <p style=\"margin:0 0 18px; font-family:Arial, Helvetica, sans-serif; font-size:15px; line-height:24px; color:#2e2c27;\">Because that story is repeated so often, most people think the issue is settled.<\u002Fp>\n              <p style=\"margin:0 0 18px; font-family:Georgia, 'Times New Roman', serif; font-size:17px; line-height:27px; font-style:italic; color:#1f1e1a;\">But what happens when you bypass the medical establishment, bypass the cultural noise, and simply ask the adult men living in these bodies what actually goes on down there?<\u002Fp>\n              <p style=\"margin:0 0 18px; font-family:Arial, Helvetica, sans-serif; font-size:15px; line-height:24px; color:#2e2c27;\">Over the past year, through The Accidental Intactivist's Inquiry, you and 500 other people helped us ask that exact question.<\u002Fp>\n              <p style=\"margin:0 0 18px; font-family:Arial, Helvetica, sans-serif; font-size:15px; line-height:24px; color:#2e2c27;\">The data is finally compiled. And it completely shatters the story we’ve been told.<\u002Fp>\n              <p style=\"margin:0 0 16px; font-family:Arial, Helvetica, sans-serif; font-size:16px; line-height:25px; font-weight:bold; color:#1f1e1a;\">Today, the Phase 1 Findings Hub is officially live.<\u002Fp>\n              <!-- Primary CTA -->\n              <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" style=\"margin:0 0 28px;\">\n                <tbody><tr>\n                  <td bgcolor=\"#d4a030\" style=\"background-color:#d4a030; border-radius:999px; mso-padding-alt:14px 34px;\">\n                    <a href=\"https://findings.circumsurvey.online\" style=\"display:block; padding:14px 34px; font-family:Arial, Helvetica, sans-serif; font-size:15px; line-height:18px; font-weight:bold; letter-spacing:0.3px; color:#18181c; text-decoration:none; border-radius:999px;\">findings.circumsurvey.online&nbsp;&nbsp;→<\u002Fa>\n                  <\u002Ftd>\n                <\u002Ftr>\n              <\u002Ftbody><\u002Ftable>\n              <p style=\"margin:0 0 20px; font-family:Arial, Helvetica, sans-serif; font-size:15px; line-height:24px; color:#2e2c27;\">When you enter the Special Report, you will see two very different realities unfold:<\u002Fp>\n              <div style=\"font-family:Georgia, 'Times New Roman', serif; font-size:19px; line-height:26px; font-weight:bold; color:#1f1e1a; padding:0 0 10px; mso-line-height-rule:exactly;\"><span style=\"font-family:'Courier New', Courier, monospace; color:#8c6920;\">1.<\u002Fspan>&nbsp; The Mechanical Reality<\u002Fdiv>\n              <p style=\"margin:0 0 24px; font-family:Arial, Helvetica, sans-serif; font-size:15px; line-height:24px; color:#2e2c27;\">We are told it's just \"extra skin.\" But when we quantified the physical mechanics of sex, a massive \"Pleasure Gap\" emerged. The data reveals a 36% drop in \"Pleasure from Mobile Skin\" for circumcised men. It proves visually and mathematically that this procedure acts as a targeted sensory amputation, converting a self-lubricating sensory organ into a friction-based tool.<\u002Fp>\n              <div style=\"font-family:Georgia, 'Times New Roman', serif; font-size:19px; line-height:26px; font-weight:bold; color:#1f1e1a; padding:0 0 10px; mso-line-height-rule:exactly;\"><span style=\"font-family:'Courier New', Courier, monospace; color:#8c6920;\">2.<\u002Fspan>&nbsp; The Psychological Reality<\u002Fdiv>\n              <p style=\"margin:0 0 24px; font-family:Arial, Helvetica, sans-serif; font-size:15px; line-height:24px; color:#2e2c27;\">We are told they won't care. But when we asked men if they experienced resentment, loss, anger, or grief regarding their alteration, the silence broke. Over 60% of circumcised respondents reported frequent negative feelings, standing in stark contrast to the near-unanimous gratitude of intact men.<\u002Fp>\n              <div style=\"font-family:Georgia, 'Times New Roman', serif; font-size:19px; line-height:26px; font-weight:bold; color:#1f1e1a; padding:0 0 10px; mso-line-height-rule:exactly;\">The Final Question<\u002Fdiv>\n              <p style=\"margin:0 0 18px; font-family:Arial, Helvetica, sans-serif; font-size:15px; line-height:24px; color:#2e2c27;\">If the mechanics are compromised, and the resentment is this high, what happens when these men become parents themselves? Do they perpetuate the cycle?<\u002Fp>\n              <p style=\"margin:0 0 22px; font-family:Arial, Helvetica, sans-serif; font-size:15px; line-height:24px; color:#2e2c27;\">We asked all 500 respondents what they would do if they had a son today. 433 of them gave the exact same answer.<\u002Fp>\n\n              <!-- By the numbers -->\n              <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"100%\" bgcolor=\"#f7efe0\" style=\"background-color:#f7efe0; border:1px solid #e2d3ae; border-radius:12px; margin:0 0 26px;\">\n                <tbody><tr>\n                  <td align=\"center\" style=\"padding:22px 16px 6px; font-family:Arial, Helvetica, sans-serif; font-size:10px; line-height:14px; font-weight:bold; letter-spacing:2.5px; text-transform:uppercase; color:#8c6920;\"><span style=\"color:#d94f4f;\">★<\u002Fspan>&nbsp; By the numbers<\u002Ftd>\n                <\u002Ftr>\n                <tr>\n                  <td style=\"padding:8px 16px 22px;\">\n                    <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"100%\">\n                      <tbody><tr>\n                        <td class=\"stat\" align=\"center\" width=\"33%\" style=\"border-top:4px solid #d94f4f; padding:12px 10px 8px; vertical-align:top;\">\n                          <div style=\"font-family:'Courier New', Courier, monospace; font-size:32px; line-height:36px; font-weight:bold; color:#1f1e1a; mso-line-height-rule:exactly;\">36%<\u002Fdiv>\n                          <div style=\"font-family:Arial, Helvetica, sans-serif; font-size:10.5px; line-height:15px; letter-spacing:1px; text-transform:uppercase; color:#6f6b62; padding-top:8px;\"><span style=\"color:#d94f4f;\">■<\u002Fspan>&nbsp; drop in pleasure from mobile skin<\u002Fdiv>\n                        <\u002Ftd>\n                        <td class=\"stat\" align=\"center\" width=\"34%\" style=\"border-top:4px solid #e8a44a; padding:12px 10px 8px; vertical-align:top; border-left:1px solid #e0d1ad; border-right:1px solid #e0d1ad;\">\n                          <div style=\"font-family:'Courier New', Courier, monospace; font-size:32px; line-height:36px; font-weight:bold; color:#1f1e1a; mso-line-height-rule:exactly;\">60%+<\u002Fdiv>\n                          <div style=\"font-family:Arial, Helvetica, sans-serif; font-size:10.5px; line-height:15px; letter-spacing:1px; text-transform:uppercase; color:#6f6b62; padding-top:8px;\"><span style=\"color:#e8a44a;\">■<\u002Fspan>&nbsp; report frequent negative feelings<\u002Fdiv>\n                        <\u002Ftd>\n                        <td class=\"stat\" align=\"center\" width=\"33%\" style=\"border-top:4px solid #68b878; padding:12px 10px 8px; vertical-align:top;\">\n                          <div style=\"font-family:'Courier New', Courier, monospace; font-size:32px; line-height:36px; font-weight:bold; color:#1f1e1a; mso-line-height-rule:exactly;\">433<span style=\"font-size:16px; color:#6f6b62;\">/500<\u002Fspan><\u002Fdiv>\n                          <div style=\"font-family:Arial, Helvetica, sans-serif; font-size:10.5px; line-height:15px; letter-spacing:1px; text-transform:uppercase; color:#6f6b62; padding-top:8px;\"><span style=\"color:#68b878;\">■<\u002Fspan>&nbsp; gave the exact same answer<\u002Fdiv>\n                        <\u002Ftd>\n                      <\u002Ftr>\n                    <\u002Ftbody><\u002Ftable>\n                  <\u002Ftd>\n                <\u002Ftr>\n              <\u002Ftbody><\u002Ftable>\n\n              <p style=\"margin:0 0 12px; font-family:Arial, Helvetica, sans-serif; font-size:16px; line-height:25px; font-weight:bold; color:#1f1e1a;\">I want you to see the data for yourself.<\u002Fp>\n              <p style=\"margin:0 0 16px; font-family:Arial, Helvetica, sans-serif; font-size:15px; line-height:24px; color:#2e2c27;\">Because you built this dataset with us, I invite you to be the first to explore the interactive hub. Read the guided report, and then jump into the Interactive Explorer (<a href=\"https://findings.circumsurvey.online/explore\" style=\"color:#8c6920; font-weight:bold; text-decoration:underline;\">https://findings.circumsurvey.online/explore<\u002Fa>) where you can cross-tabulate the data and read the unvarnished stories in the respondents' own words.<\u002Fp>\n              <!-- Secondary CTA -->\n              <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" style=\"margin:0 0 28px;\">\n                <tbody><tr>\n                  <td style=\"border:2px solid #d4a030; border-radius:999px; mso-padding-alt:11px 28px;\">\n                    <a href=\"https://findings.circumsurvey.online/explore\" style=\"display:block; padding:11px 28px; font-family:Arial, Helvetica, sans-serif; font-size:14px; line-height:18px; font-weight:bold; letter-spacing:0.3px; color:#8c6920; text-decoration:none; border-radius:999px;\">Jump into the Interactive Explorer&nbsp;&nbsp;→<\u002Fa>\n                  <\u002Ftd>\n                <\u002Ftr>\n              <\u002Ftbody><\u002Ftable>\n              <p style=\"margin:0 0 18px; font-family:Arial, Helvetica, sans-serif; font-size:15px; line-height:24px; color:#2e2c27;\">My parents made an unusual choice in the 1970s, leaving me intact. It gave me a lens to look at a routine procedure and ask: <em style=\"font-family:Georgia, 'Times New Roman', serif; color:#1f1e1a;\">Why isn't this weird to more of us?<\u002Fem><\u002Fp>\n              <p style=\"margin:0 0 18px; font-family:Arial, Helvetica, sans-serif; font-size:15px; line-height:24px; color:#2e2c27;\">Before you click the link, I invite you to borrow that lens. Do not look at this data to defend a past choice. Look at it with simple, radical curiosity.<\u002Fp>\n              <p style=\"margin:0 0 26px; font-family:Arial, Helvetica, sans-serif; font-size:15px; line-height:24px; font-weight:bold; color:#1f1e1a;\">Let the data show you what is actually happening.<\u002Fp>\n            <\u002Ftd>\n          <\u002Ftr>\n\n          <!-- Sign-off -->\n          <tr>\n            <td class=\"px\" bgcolor=\"#faf6f0\" style=\"background-color:#faf6f0; padding:0 44px 40px;\">\n              <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" style=\"margin:0 0 20px;\">\n                <tbody><tr><td width=\"72\" style=\"border-top:3px dotted #c9a24a; font-size:0; line-height:0;\">&nbsp;<\u002Ftd><\u002Ftr>\n              <\u002Ftbody><\u002Ftable>\n              <p style=\"margin:0 0 14px; font-family:Arial, Helvetica, sans-serif; font-size:15px; line-height:24px; color:#2e2c27;\">In solidarity,<\u002Fp>\n              <div style=\"font-family:Georgia, 'Times New Roman', serif; font-size:21px; line-height:26px; font-weight:bold; font-style:italic; color:#1f1e1a;\">Tone Pettit<\u002Fdiv>\n              <div style=\"font-family:Arial, Helvetica, sans-serif; font-size:12.5px; line-height:19px; color:#6f6b62; padding-top:4px;\">Lead Researcher, The Accidental Intactivist's Inquiry<\u002Fdiv>\n            <\u002Ftd>\n          <\u002Ftr>\n\n          <!-- Rainbow rule -->\n          <tr>\n            <td style=\"padding:0;\">\n              <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"100%\">\n                <tbody><tr>\n                  <td width=\"20%\" bgcolor=\"#d94f4f\" style=\"height:3px; font-size:0; line-height:0;\">&nbsp;<\u002Ftd>\n                  <td width=\"20%\" bgcolor=\"#e8a44a\" style=\"height:3px; font-size:0; line-height:0;\">&nbsp;<\u002Ftd>\n                  <td width=\"20%\" bgcolor=\"#e8c868\" style=\"height:3px; font-size:0; line-height:0;\">&nbsp;<\u002Ftd>\n                  <td width=\"20%\" bgcolor=\"#68b878\" style=\"height:3px; font-size:0; line-height:0;\">&nbsp;<\u002Ftd>\n                  <td width=\"20%\" bgcolor=\"#5b93c7\" style=\"height:3px; font-size:0; line-height:0;\">&nbsp;<\u002Ftd>\n                <\u002Ftr>\n              <\u002Ftbody><\u002Ftable>\n            <\u002Ftd>\n          <\u002Ftr>\n\n          <!-- Footer -->\n          <tr>\n            <td class=\"darkbar\" align=\"center\" bgcolor=\"#18181c\" style=\"background-color:#18181c; padding:26px 40px 30px;\">\n              <div style=\"font-family:'Courier New', Courier, monospace; font-size:11px; line-height:17px; letter-spacing:1px; color:#8f8c94;\">Anonymous. Independent. n=500+.<\u002Fdiv>\n              <div style=\"font-family:Arial, Helvetica, sans-serif; font-size:11px; line-height:17px; color:#a5a1aa; padding-top:12px;\">You're receiving this email because you took part in The Accidental Intactivist's Inquiry.<\u002Fdiv>\n              <!-- Replace address + unsubscribe URL with your ESP's merge tags before sending -->\n              <div style=\"font-family:Arial, Helvetica, sans-serif; font-size:11px; line-height:17px; color:#a5a1aa; padding-top:4px;\">CircumSurvey · PO Box 45021 · Seattle, WA 98145<\u002Fdiv>\n              <div style=\"font-family:Arial, Helvetica, sans-serif; font-size:11px; line-height:17px; padding-top:12px;\">\n                <a href=\"https://circumsurvey.online/unsubscribe\" style=\"color:#e8b840; text-decoration:underline;\">Unsubscribe<\u002Fa>\n                <span style=\"color:#55525c;\">&nbsp;·&nbsp;<\u002Fspan>\n                <a href=\"https://findings.circumsurvey.online\" style=\"color:#e8b840; text-decoration:underline;\">View the findings<\u002Fa>\n              <\u002Fdiv>\n            <\u002Ftd>\n          <\u002Ftr>\n\n        <\u002Ftbody><\u002Ftable>\n        <!--[if mso]><\u002Ftd><\u002Ftr><\u002Ftable><![endif]-->\n      <\u002Ftd>\n    <\u002Ftr>\n  <\u002Ftbody><\u002Ftable>\n\n\n<\u002Fbody><\u002Fhtml>"
